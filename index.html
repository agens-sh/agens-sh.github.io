<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agens-sh</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="brand/agens-favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="brand/agens-favicon-light.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="brand/agens-favicon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f4ef;
        --fg: #0c0c0c;
        --muted: #57534e;
        --accent: #ff4d00;
        --header: #f6f4ef;
        --line: rgba(12, 12, 12, 0.12);
        --panel: #fffdf8;
        --tap: 2.75rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0c0c;
          --fg: #f5f5f4;
          --muted: #a8a29e;
          --header: #0c0c0c;
          --line: rgba(245, 245, 244, 0.14);
          --panel: #161616;
        }

        .wordmark-light {
          display: none;
        }

        .wordmark-dark {
          display: block;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }

      a {
        color: inherit;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 2;
        min-height: calc(var(--tap) + env(safe-area-inset-top, 0px));
        padding: env(safe-area-inset-top, 0) 0.75rem 0;
        background: var(--header);
        border-bottom: 1px solid var(--line);
      }

      .menu {
        position: relative;
      }

      .menu summary {
        display: grid;
        place-items: center;
        width: var(--tap);
        height: var(--tap);
        list-style: none;
        cursor: pointer;
      }

      .menu summary::-webkit-details-marker {
        display: none;
      }

      .icon {
        display: block;
        width: 1.35rem;
        height: 1.35rem;
      }

      .icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .menu nav {
        position: absolute;
        top: calc(100% - 0.25rem);
        left: 0;
        min-width: 10rem;
        padding: 0.5rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        box-shadow: 0 0.5rem 1.25rem rgba(12, 12, 12, 0.12);
      }

      .menu nav a {
        display: block;
        padding: 0.65rem 0.75rem;
        text-decoration: none;
        border-radius: 0.5rem;
      }

      .profile {
        display: grid;
        place-items: center;
        position: relative;
        width: var(--tap);
        height: var(--tap);
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .profile:hover::after,
      .profile:focus-visible::after {
        content: attr(data-label);
        position: absolute;
        top: calc(100% - 0.2rem);
        right: 0.15rem;
        z-index: 3;
        padding: 0.3rem 0.5rem;
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        background: var(--panel);
        color: var(--fg);
        font-size: 0.75rem;
        line-height: 1;
        white-space: nowrap;
        box-shadow: 0 0.35rem 0.85rem rgba(12, 12, 12, 0.12);
      }

      main {
        display: grid;
        place-items: center;
        flex: 1;
        padding: 2rem 1.25rem 3rem;
      }

      .hero {
        max-width: 22rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.85rem;
      }

      h1 img {
        display: block;
        width: min(16rem, 100%);
        height: auto;
        margin-inline: auto;
      }

      .wordmark-dark {
        display: none;
      }

      .lede {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      footer {
        padding: 1rem 1.25rem calc(1rem + env(safe-area-inset-bottom, 0px));
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
      }

      dialog {
        width: min(20rem, calc(100vw - 2rem));
        padding: 1.25rem;
        border: 1px solid var(--line);
        border-radius: 0.85rem;
        background: var(--panel);
        color: var(--fg);
      }

      dialog p {
        margin: 0 0 1rem;
        line-height: 1.45;
      }

      dialog button {
        min-height: var(--tap);
        padding: 0 1rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <details class="menu">
        <summary aria-label="Open menu">
          <span class="icon" data-icon="menu" aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 5h16" />
              <path d="M4 12h16" />
              <path d="M4 19h16" />
            </svg>
          </span>
        </summary>
        <nav>
          <a href="/">Home</a>
        </nav>
      </details>
      <button
        type="button"
        class="profile"
        id="login-button"
        data-label="login"
        aria-label="login"
      >
        <span class="icon" data-icon="circle-user" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="10" r="3" />
            <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662" />
          </svg>
        </span>
      </button>
    </header>
    <main>
      <div class="hero">
        <h1>
          <img
            class="wordmark-light"
            src="brand/agens-wordmark.svg"
            alt="agens"
            width="309"
            height="114"
          />
          <img
            class="wordmark-dark"
            src="brand/agens-wordmark-dark.svg"
            alt=""
            width="309"
            height="114"
          />
        </h1>
        <p class="lede">Placeholder for now.</p>
      </div>
    </main>
    <footer>
      <a rel="license" href="https://creativecommons.org/licenses/by-nc-nd/4.0/"
        >CC BY-NC-ND 4.0</a
      >
    </footer>
    <dialog id="login-dialog" aria-labelledby="login-title">
      <p id="login-title">Login is a placeholder for now.</p>
      <form method="dialog">
        <button type="submit">Close</button>
      </form>
    </dialog>
    <script>
      (function () {
        var lucide = "https://cdn.jsdelivr.net/npm/lucide-static@1.72.0/icons/";
        function paint(host, markup) {
          host.innerHTML = markup;
          var svg = host.querySelector("svg");
          if (!svg) {
            return;
          }
          svg.setAttribute("aria-hidden", "true");
          svg.removeAttribute("width");
          svg.removeAttribute("height");
        }
        document.querySelectorAll(".icon[data-icon]").forEach(function (host) {
          var name = host.getAttribute("data-icon");
          fetch(lucide + name + ".svg", { mode: "cors" })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("cdn");
              }
              return response.text();
            })
            .catch(function () {
              return fetch("icons/" + name + ".svg").then(function (response) {
                if (!response.ok) {
                  throw new Error("local");
                }
                return response.text();
              });
            })
            .then(function (markup) {
              paint(host, markup);
            })
            .catch(function () {
              /* keep the inline Lucide SVG already in the page */
            });
        });
        document
          .getElementById("login-button")
          .addEventListener("click", function () {
            document.getElementById("login-dialog").showModal();
          });
      })();
    </script>
  </body>
</html>
